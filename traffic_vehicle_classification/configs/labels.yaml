project_name: traffic_vehicle_classification
target_raw_per_label: 1500

sources:
  - google
  - naver
  - duckduckgo

image_cleaning:
  min_width: 128
  min_height: 128
  output_format: jpg
  jpeg_quality: 95

deduplication:
  hash_method: phash
  hamming_threshold: 6

split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  random_seed: 42

autocrawler:
  threads: 4
  full_resolution: false
  no_gui: auto
  limit_per_keyword: 120

duckduckgo:
  region: us-en
  safesearch: moderate
  backend: duckduckgo
  size: Large
  max_results_per_keyword: 180
  timeout_seconds: 15

labels:
  - name: bicycle
    keywords:
      - bicycle
      - road bicycle
      - mountain bicycle
      - city bicycle
      - bicycle on road
      - bike vehicle
      - electric bicycle
      - racing bicycle
  - name: boat
